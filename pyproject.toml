[project]
name = "headvoice"
version = "0.1.0"
description = "Webcam communication aid: head tilts to choose, long blink to confirm, the app speaks."
requires-python = "==3.11.*"
dependencies = [
    "opencv-contrib-python==5.0.0.93",
    "numpy==2.2.6",  # newest with manylinux2014 wheels (Lambda python3.11 base is Amazon Linux 2)
    "pydantic>=2.7,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3", "httpx>=0.27"]
eval = [
    "matplotlib>=3.8",
]
infra = [
    "aws-cdk-lib==2.274.0",
    "constructs==10.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headvoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["E501"]  # long prose strings in generated reports
